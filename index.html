<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC PRODUCCIONES - Professional Sax Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carga iconos para los botones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <img src="path/to/your/new/logo.png" alt="VC Producciones">
            <span>PRODUCCIONES</span>
        </div>
        <div class="controls-top">
            <button class="control-btn active">Alto / Baritono</button>
            <button class="control-btn">Tenor / Soprano</button>
            <div class="meter">
                <span>120 BPM</span>
                <div class="master-eq">Master EQ</div>
            </div>
            <button class="pro-tools-btn"><i class="fas fa-cog"></i> PRO TOOLS</button>
        </div>
    </header>

    <main class="app-main">
        <aside class="sidebar panel">
            <h3>REPERTORIO EVENTOS</h3>
            <ul>
                <li><a href="#"><i class="fas fa-heart"></i> Favoritos</a></li>
                <li><a href="#"><i class="fas fa-history"></i> Recientes</a></li>
                <li><a href="#"><i class="fas fa-folder"></i> Pistas de Saxo</a></li>
            </ul>
        </aside>

        <section class="player-decks panel">
            <!-- Deck A -->
            <div class="deck deck-a">
                <div class="deck-header">
                    <span>Sin pista cargada</span>
                    <button class="load-btn">CARGAR <i class="fas fa-plus"></i></button>
                </div>
                <div class="track-info">0:00 / 0:00</div>
                <div class="waveform">Forma de onda aquí</div>
                <div class="deck-controls">
                    <button class="cue-btn">CUE</button>
                    <button class="play-btn active"><i class="fas fa-play"></i> PLAY</button>
                    <button class="stop-btn">STOP</button>
                </div>
            </div>

            <!-- Mixer Central -->
            <div class="mixer">
                <input type="range" class="crossfader" min="0" max="100" value="50">
            </div>

            <!-- Deck B -->
            <div class="deck deck-b">
                <div class="deck-header">
                    <span>Sin pista cargada</span>
                    <button class="load-btn">CARGAR <i class="fas fa-plus"></i></button>
                </div>
                <div class="track-info">0:00 / 0:00</div>
                <div class="waveform">Forma de onda aquí</div>
                <div class="deck-controls">
                    <button class="cue-btn">CUE</button>
                    <button class="play-btn"><i class="fas fa-play"></i> PLAY</button>
                    <button class="stop-btn">STOP</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>Edit with Lovable</p>
        <p>14/10/2036 01:41</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
